# yaml-language-server: $schema=https://nfpm.goreleaser.com/static/schema.json
name: thirdflare
arch: all
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: ThirdFlare One contributors
description: |-
  ThirdFlare One — unofficial third-party Cloudflare One client for Linux.
  Drop-in warp-cli GUI parity with the Windows Cloudflare One app.
  Requires Cloudflare WARP (warp-cli) on the host.
vendor: ThirdFlare One
homepage: https://github.com/bodencrouch/thirdflare-one
license: MIT
contents:
  - src: ./dist/payload/usr/lib/thirdflare
    dst: /usr/lib/thirdflare
  - src: ./dist/payload/usr/bin/thirdflare
    dst: /usr/bin/thirdflare
    file_info:
      mode: 0755
  - src: ./dist/payload/usr/bin/thirdflare-one
    dst: /usr/bin/thirdflare-one
    file_info:
      mode: 0755
  - src: ./dist/payload/usr/bin/thirdflare-one-gui
    dst: /usr/bin/thirdflare-one-gui
    file_info:
      mode: 0755
  - src: ./dist/payload/usr/bin/thirdflare-one-tray
    dst: /usr/bin/thirdflare-one-tray
    file_info:
      mode: 0755
  - src: ./dist/payload/usr/share/polkit-1/actions/com.thirdflare.one.policy
    dst: /usr/share/polkit-1/actions/com.thirdflare.one.policy
  - src: ./dist/payload/usr/share/applications/thirdflare-one.desktop
    dst: /usr/share/applications/thirdflare-one.desktop
  - src: ./dist/payload/usr/share/icons/hicolor/scalable/apps/thirdflare.svg
    dst: /usr/share/icons/hicolor/scalable/apps/thirdflare.svg
  - src: ./dist/payload/usr/lib/systemd/user/thirdflare-one.service
    dst: /usr/lib/systemd/user/thirdflare-one.service
  - src: ./dist/payload/etc/default/thirdflare
    dst: /etc/default/thirdflare
  - src: ./dist/payload/etc/thirdflare/config.json.example
    dst: /etc/thirdflare/config.json.example
  - src: ./dist/payload/usr/share/doc/thirdflare
    dst: /usr/share/doc/thirdflare
  - src: ./dist/payload/usr/share/licenses/thirdflare
    dst: /usr/share/licenses/thirdflare
  - src: ./dist/payload/etc/NetworkManager/dispatcher.d/99-thirdflare-warp
    dst: /etc/NetworkManager/dispatcher.d/99-thirdflare-warp
    file_info:
      mode: 0755
  - src: ./dist/payload/etc/sysctl.d/99-thirdflare-warp.conf
    dst: /etc/sysctl.d/99-thirdflare-warp.conf
  - src: ./dist/payload/usr/lib/NetworkManager/VPN/nm-thirdflare-warp-service.name
    dst: /usr/lib/NetworkManager/VPN/nm-thirdflare-warp-service.name
  - src: ./dist/payload/usr/share/thirdflare-one/networkmanager/profiles
    dst: /usr/share/thirdflare-one/networkmanager/profiles
depends:
  - nodejs
recommends:
  - python3-pyqt6
  - python3-pyqt6-webengine
  - network-manager
  - yad
  - libnotify-bin
overrides:
  deb:
    depends:
      - "nodejs (>= 20)"
  rpm:
    depends:
      - "nodejs >= 20"
    recommends:
      - python3-pyqt6
      - python3-pyqt6-webengine
      - yad
      - libnotify
  archlinux:
    depends:
      - nodejs
    recommends:
      - python3-pyqt6
      - python3-pyqt6-webengine
      - yad
      - libnotify
scripts:
  postinstall: ./packaging/scripts/nfpm-postinstall.sh
  postremove: ./packaging/scripts/nfpm-postremove.sh
